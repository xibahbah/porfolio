<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta – Keith Gong</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</head>
<body>
    <header class="page-header">
        <h1>Code Meta Analysis</h1>
        <p>Summary statistics and commit patterns generated from this portfolio codebase.</p>
    </header>

    <section>
        <h2>Summary Stats</h2>
        <div id="stats"></div>
    </section>

    <section>
        <h2>Commits by Time of Day</h2>
        <p id="selection-count">No commits selected</p>
        <div id="chart"></div>
        <dl id="language-breakdown" class="stats"></dl>
    </section>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd><a href="" id="commit-link" target="_blank" rel="noopener noreferrer"></a></dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>

        <dt>Time</dt>
        <dd id="commit-time"></dd>

        <dt>Author</dt>
        <dd id="commit-author"></dd>

        <dt>Lines</dt>
        <dd id="commit-lines"></dd>
    </dl>
</body>
</html>
