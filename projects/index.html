<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects – Keith Gong</title>
    <link rel="stylesheet" href="../style.css?v=lab5-pie-size">
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
    <style>
        
        .page-header {
            padding-block: 2em 1em;
            border-bottom: 1px solid oklch(87% 0% 0);
            margin-bottom: 2em;
        }

        .page-header h1 {
            margin: 0 0 0.2em;
        }

        .page-header p {
            margin: 0;
            color: oklch(48% 0% 0);
            font-size: 1.05em;
        }

        .projects {
            grid-template-columns: repeat(auto-fill, minmax(min(22em, 100%), 1fr));
            gap: 1.5em;
        }

        .projects article {
            background: white;
            border: 1px solid oklch(88% 0% 0);
            border-radius: 1em;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            grid-row: unset;
            grid-template-rows: unset;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: default;
        }

        .projects article:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px oklch(0% 0% 0 / 10%);
        }
        .projects article:nth-child(4n+1) { border-top: 4px solid oklch(65% 50% 0); }
        .projects article:nth-child(4n+2) { border-top: 4px solid oklch(60% 40% 145); }
        .projects article:nth-child(4n+3) { border-top: 4px solid oklch(58% 45% 260); }
        .projects article:nth-child(4n+4) { border-top: 4px solid oklch(62% 42% 25); }

        .projects article img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .projects article h2 {
            margin: 0;
            font-size: 1.05em;
            font-weight: 700;
            line-height: 1.3;
            padding: 1em 1.2em 0.5em;
        }

        .projects article .project-meta {
            padding: 0 1.2em 1.2em;
            flex: 1;
        }

        .projects article p {
            margin: 0;
            font-size: 0.88em;
            color: oklch(42% 0% 0);
            line-height: 1.6;
        }

        footer {
            margin-top: 3em;
            padding-block: 1.25em;
            border-top: 1px solid oklch(87% 0% 0);
            text-align: center;
            font-size: 0.85em;
            color: oklch(55% 0% 0);
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="projects-title">My Projects</h1>
        <p>A curated selection of my most impactful work.</p>
    </div>

    <div class="chart-container" aria-label="Projects by year">
        <svg id="projects-pie-plot" viewBox="-50 -50 100 100"></svg>
        <ul class="legend"></ul>
    </div>

    <input
        class="searchBar"
        type="search"
        aria-label="Search projects"
        placeholder="Search projects..."
    >

    <div class="projects"></div>

    <footer>© 2026 Keith Gong</footer>
</body>
</html>
