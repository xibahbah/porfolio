<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects – Keith Gong</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
    <style>
        
        .page-header {
            padding-block: 2em 1em;
            border-bottom: 1px solid oklch(87% 0% 0);
            margin-bottom: 2em;
        }

        .page-header h1 {
            margin: 0 0 0.2em;
        }

        .page-header p {
            margin: 0;
            color: oklch(48% 0% 0);
            font-size: 1.05em;
        }

        .projects {
            grid-template-columns: repeat(auto-fill, minmax(22em, 1fr));
            gap: 1.5em;
        }

        .projects article {
            background: white;
            border: 1px solid oklch(88% 0% 0);
            border-radius: 1em;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            grid-row: unset;
            grid-template-rows: unset;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: default;
        }

        .projects article:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px oklch(0% 0% 0 / 10%);
        }
        .projects article:nth-child(1) { border-top: 4px solid oklch(65% 50% 0); }
        .projects article:nth-child(2) { border-top: 4px solid oklch(60% 40% 145); }
        .projects article:nth-child(3) { border-top: 4px solid oklch(58% 45% 260); }
        .projects article:nth-child(4) { border-top: 4px solid oklch(62% 42% 25); }

        .projects article .img-wrap {
            background: oklch(96% 0% 0);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2em;
            border-bottom: 1px solid oklch(91% 0% 0);
        }

        .projects article .img-wrap img {
            width: 80px;
            height: 80px;
            opacity: 0.35;
        }

        .projects article .card-body {
            padding: 1.4em 1.5em 1.6em;
            display: flex;
            flex-direction: column;
            gap: 0.6em;
            flex: 1;
        }

        .projects article h2 {
            margin: 0;
            font-size: 1.1em;
            line-height: 1.3;
        }

        .projects article p {
            margin: 0;
            font-size: 0.9em;
            color: oklch(42% 0% 0);
            line-height: 1.6;
            flex: 1;
        }

        .projects article .tag {
            display: inline-block;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.25em 0.7em;
            border-radius: 2em;
            background: oklch(94% 0% 0);
            color: oklch(40% 0% 0);
            align-self: flex-start;
        }

        .projects article:nth-child(1) .tag { background: oklch(94% 15% 0); color: oklch(38% 40% 0); }
        .projects article:nth-child(2) .tag { background: oklch(93% 12% 145); color: oklch(36% 35% 145); }
        .projects article:nth-child(3) .tag { background: oklch(93% 12% 260); color: oklch(36% 38% 260); }
        .projects article:nth-child(4) .tag { background: oklch(94% 12% 25); color: oklch(36% 38% 25); }

        footer {
            margin-top: 3em;
            padding-block: 1.25em;
            border-top: 1px solid oklch(87% 0% 0);
            text-align: center;
            font-size: 0.85em;
            color: oklch(55% 0% 0);
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="projects-title">My Projects</h1>
        <p>A curated selection of my most impactful work.</p>
    </div>

    <div class="projects"></div>

    <footer>© 2026 Keith Gong</footer>
</body>
</html>
