<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#2d1200"/>
    </linearGradient>
    <radialGradient id="fireglow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Terrain -->
  <polygon points="0,380 80,340 160,310 240,290 320,280 400,270 480,280 560,295 640,320 720,340 800,360 800,450 0,450" fill="#1a3d1a" opacity="0.7"/>
  <!-- Grid overlay (cellular automaton cells) -->
  <g opacity="0.35" stroke="#ff6600" stroke-width="0.5" fill="none">
    <line x1="100" y1="100" x2="100" y2="380"/>
    <line x1="160" y1="100" x2="160" y2="380"/>
    <line x1="220" y1="100" x2="220" y2="380"/>
    <line x1="280" y1="100" x2="280" y2="380"/>
    <line x1="340" y1="100" x2="340" y2="380"/>
    <line x1="400" y1="100" x2="400" y2="380"/>
    <line x1="460" y1="100" x2="460" y2="380"/>
    <line x1="520" y1="100" x2="520" y2="380"/>
    <line x1="580" y1="100" x2="580" y2="380"/>
    <line x1="640" y1="100" x2="640" y2="380"/>
    <line x1="100" y1="160" x2="700" y2="160"/>
    <line x1="100" y1="220" x2="700" y2="220"/>
    <line x1="100" y1="280" x2="700" y2="280"/>
    <line x1="100" y1="340" x2="700" y2="340"/>
  </g>
  <!-- Burned cells -->
  <rect x="280" y="220" width="58" height="58" rx="3" fill="#3d0000" opacity="0.95"/>
  <rect x="340" y="220" width="58" height="58" rx="3" fill="#5c1000" opacity="0.95"/>
  <rect x="280" y="280" width="58" height="58" rx="3" fill="#4a0000" opacity="0.95"/>
  <rect x="340" y="280" width="58" height="58" rx="3" fill="#6b1a00" opacity="0.9"/>
  <rect x="220" y="280" width="58" height="58" rx="3" fill="#3d0000" opacity="0.8"/>
  <!-- Active fire cells -->
  <rect x="400" y="220" width="58" height="58" rx="3" fill="#cc3300" opacity="0.9"/>
  <rect x="340" y="160" width="58" height="58" rx="3" fill="#dd4400" opacity="0.85"/>
  <rect x="400" y="280" width="58" height="58" rx="3" fill="#ee5500" opacity="0.85"/>
  <rect x="460" y="220" width="58" height="58" rx="3" fill="#dd4400" opacity="0.8"/>
  <!-- Bright flame cells -->
  <rect x="400" y="160" width="58" height="58" rx="3" fill="#ff6600" opacity="0.9"/>
  <rect x="460" y="160" width="58" height="58" rx="3" fill="#ff8800" opacity="0.85"/>
  <rect x="460" y="280" width="58" height="58" rx="3" fill="#ff6600" opacity="0.8"/>
  <!-- Glow -->
  <ellipse cx="430" cy="230" rx="200" ry="150" fill="url(#fireglow)"/>
  <!-- Flames on top -->
  <path d="M390,220 Q400,190 415,200 Q410,170 430,160 Q445,180 440,200 Q460,185 455,220Z" fill="#ffaa00" opacity="0.95"/>
  <path d="M450,210 Q462,185 475,195 Q470,168 488,158 Q502,178 496,198Z" fill="#ff8800" opacity="0.85"/>
  <!-- Wind arrow -->
  <g transform="translate(660,80)" opacity="0.7">
    <line x1="0" y1="20" x2="80" y2="20" stroke="#87ceeb" stroke-width="2.5"/>
    <polygon points="80,20 65,13 65,27" fill="#87ceeb"/>
    <text x="40" y="45" text-anchor="middle" font-family="system-ui" font-size="11" fill="#87ceeb">wind: 18 mph</text>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#ff660050">Cellular Automaton · Wind · Humidity · Vegetation</text>
</svg>
