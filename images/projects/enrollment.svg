  <text x="307" y="158" text-anchor="middle" font-family="system-ui" font-size="13" fill="white" opacity="0.6">5</text>
  <!-- Availability indicators -->
  <rect x="95" y="180" width="250" height="28" rx="6" fill="#1b5e20" opacity="0.8"/>
