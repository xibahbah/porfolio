  <rect x="95" y="250" width="250" height="28" rx="6" fill="#e65100" opacity="0.7"/>
  <text x="220" y="269" text-anchor="middle" font-family="system-ui" font-size="12" fill="#ffcc80">MATH 183 · seats: 4/80 ⚠</text>
  <rect x="95" y="285" width="250" height="28" rx="6" fill="#1b5e20" opacity="0.8"/>
  <text x="220" y="304" text-anchor="middle" font-family="system-ui" font-size="12" fill="#69f0ae">DSC 106 · seats: 52/120 ✓</text>
  <!-- Probability meter on right -->
  <rect x="460" y="80" width="260" height="260" rx="12" fill="#2a1045" stroke="#7b2ff7" stroke-width="1.5" opacity="0.9"/>
  <text x="590" y="115" text-anchor="middle" font-family="system-ui" font-size="14" fill="#bb86fc">Fill Probability</text>
  <!-- Gauge arcs -->
  <path d="M530,230 A80,80 0 0,1 650,230" fill="none" stroke="#2d2d2d" stroke-width="16"/>
  <path d="M530,230 A80,80 0 0,1 592,158" fill="none" stroke="#7b2ff7" stroke-width="16" stroke-linecap="round"/>
  <circle cx="592" cy="158" r="8" fill="#ce93d8"/>
  <text x="590" y="238" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="bold" fill="white">76%</text>
