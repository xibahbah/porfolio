  <!-- Model badges -->
  <rect x="475" y="285" width="110" height="30" rx="6" fill="#4a148c" opacity="0.8"/>
  <text x="530" y="305" text-anchor="middle" font-family="system-ui" font-size="11" fill="#e040fb">Logistic Reg.</text>
  <rect x="600" y="285" width="105" height="30" rx="6" fill="#4a148c" opacity="0.8"/>
  <text x="652" y="305" text-anchor="middle" font-family="system-ui" font-size="11" fill="#e040fb">Random Forest</text>
  <text x="400" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#bb86fc50">UCSD WebReg · Enrollment Prediction · ML</text>
