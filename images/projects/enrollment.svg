  <text x="211" y="128" text-anchor="middle" font-family="system-ui" font-size="11" fill="#bb86fc">W</text>
  <text x="259" y="128" text-anchor="middle" font-family="system-ui" font-size="11" fill="#bb86fc">T</text>
  <text x="307" y="128" text-anchor="middle" font-family="system-ui" font-size="11" fill="#bb86fc">F</text>
