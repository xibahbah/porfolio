<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Positive bubble -->
  <rect x="80" y="80" width="260" height="90" rx="18" fill="#2e7d32" opacity="0.85"/>
  <polygon points="130,170 160,190 190,170" fill="#2e7d32" opacity="0.85"/>
  <text x="210" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="white" opacity="0.9">Great product! Absolutely love it</text>
  <text x="210" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="white" opacity="0.9">and highly recommend 🎉</text>
  <rect x="88" y="155" width="58" height="6" rx="3" fill="#66bb6a" opacity="0.7"/>
  <text x="200" y="164" font-family="system-ui,sans-serif" font-size="11" fill="#a5d6a7">POSITIVE · 97%</text>
  <!-- Negative bubble -->
  <rect x="460" y="140" width="260" height="90" rx="18" fill="#c62828" opacity="0.85"/>
  <polygon points="670,230 640,250 610,230" fill="#c62828" opacity="0.85"/>
  <text x="590" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="white" opacity="0.9">Terrible experience, never</text>
  <text x="590" y="198" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="white" opacity="0.9">buying from them again 😤</text>
  <rect x="468" y="215" width="58" height="6" rx="3" fill="#ef9a9a" opacity="0.7"/>
  <text x="580" y="224" font-family="system-ui,sans-serif" font-size="11" fill="#ef9a9a">NEGATIVE · 94%</text>
  <!-- Neutral bubble -->
  <rect x="240" y="240" width="310" height="70" rx="18" fill="#37474f" opacity="0.85"/>
  <text x="395" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="white" opacity="0.9">Ordered yesterday, still waiting</text>
  <text x="395" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="white" opacity="0.9">for shipping confirmation</text>
  <text x="390" y="332" font-family="system-ui,sans-serif" font-size="11" fill="#90a4ae">NEUTRAL · 81%</text>
  <!-- BERT label -->
  <rect x="290" y="370" width="220" height="36" rx="8" fill="#311b92" opacity="0.8"/>
  <text x="400" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#ce93d8">BERT · 91% accuracy · 50k tweets</text>
</svg>
