  <text x="680" y="107" text-anchor="end" font-family="system-ui" font-size="12" fill="#ffcc02">★ All-Star</text>
  <rect x="475" y="185" width="250" height="90" rx="10" fill="#1a1a1a" stroke="#1565c0" stroke-width="1.5" opacity="0.95"/>
