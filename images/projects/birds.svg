<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Dividing line -->
  <line x1="400" y1="50" x2="400" y2="400" stroke="#ffffff20" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="200" y="80" text-anchor="middle" font-family="system-ui" font-size="14" fill="#64b5f6" opacity="0.7">BIRD</text>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui" font-size="14" fill="#ef9a9a" opacity="0.7">PLANE</text>
  <!-- Bird silhouette -->
  <g transform="translate(120, 150)" opacity="0.9">
    <path d="M80,60 Q60,20 20,10 Q50,40 40,60 Q60,55 80,60Z" fill="#90caf9"/>
    <path d="M80,60 Q100,20 140,10 Q110,40 120,60 Q100,55 80,60Z" fill="#64b5f6"/>
    <ellipse cx="80" cy="68" rx="22" ry="12" fill="#42a5f5"/>
    <ellipse cx="68" cy="62" rx="6" ry="4" fill="#1565c0"/>
    <path d="M92,70 L110,75 L92,78Z" fill="#ffb300"/>
  </g>
  <!-- Another bird -->
  <g transform="translate(210, 230) scale(0.7)" opacity="0.75">
    <path d="M80,60 Q60,20 20,10 Q50,40 40,60 Q60,55 80,60Z" fill="#90caf9"/>
    <path d="M80,60 Q100,20 140,10 Q110,40 120,60 Q100,55 80,60Z" fill="#64b5f6"/>
    <ellipse cx="80" cy="68" rx="22" ry="12" fill="#42a5f5"/>
  </g>
  <!-- Plane silhouette -->
  <g transform="translate(480, 130)" opacity="0.9">
    <ellipse cx="90" cy="60" rx="80" ry="16" fill="#ef9a9a"/>
    <polygon points="90,44 130,60 90,68" fill="#e57373"/>
    <polygon points="30,44 10,20 50,44" fill="#ef9a9a" opacity="0.8"/>
    <polygon points="30,76 10,100 50,76" fill="#ef9a9a" opacity="0.8"/>
    <polygon points="152,56 175,44 175,68" fill="#e57373" opacity="0.7"/>
    <circle cx="50" cy="60" r="10" fill="#1a2a40" opacity="0.5"/>
  </g>
  <!-- Confidence scores -->
  <rect x="80" y="290" width="260" height="80" rx="10" fill="#0d1f35" opacity="0.9"/>
  <text x="105" y="315" font-family="system-ui" font-size="12" fill="#90caf9">BIRD confidence</text>
  <rect x="105" y="322" width="200" height="14" rx="7" fill="#1565c0" opacity="0.4"/>
  <rect x="105" y="322" width="188" height="14" rx="7" fill="#42a5f5" opacity="0.9"/>
  <text x="305" y="333" font-family="system-ui" font-size="11" fill="white">94%</text>
  <text x="105" y="355" font-family="system-ui" font-size="12" fill="#ef9a9a">PLANE confidence</text>
  <rect x="105" y="358" width="200" height="14" rx="7" fill="#b71c1c" opacity="0.3"/>
  <rect x="105" y="358" width="12" height="14" rx="7" fill="#ef5350" opacity="0.7"/>
  <text x="130" y="369" font-family="system-ui" font-size="11" fill="white">6%</text>
  <!-- CNN label -->
  <rect x="460" y="310" width="260" height="50" rx="10" fill="#0d1f35" opacity="0.9"/>
  <text x="590" y="330" text-anchor="middle" font-family="system-ui" font-size="13" fill="#ef9a9a">CNN · PyTorch · 94% accuracy</text>
  <text x="590" y="350" text-anchor="middle" font-family="system-ui" font-size="12" fill="#ef9a9a80">10,000 labeled aerial images</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#ffffff30">Image Classification · Deep Learning</text>
</svg>
