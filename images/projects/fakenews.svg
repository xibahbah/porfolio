<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="100%" stop-color="#2a0a2a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Newspaper article mockup -->
  <rect x="80" y="70" width="330" height="300" rx="8" fill="#f5f0e8" opacity="0.95"/>
  <!-- Newspaper header -->
  <rect x="80" y="70" width="330" height="45" rx="8" fill="#222" opacity="0.95"/>
  <rect x="80" y="103" width="330" height="12" fill="#222"/>
  <text x="245" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="white">THE DAILY CHRONICLE</text>
  <!-- Headline -->
  <text x="100" y="140" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#111">SCIENTISTS CONFIRM: 5G</text>
  <text x="100" y="158" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#111">TOWERS CAUSE RAIN</text>
  <!-- Article text lines -->
  <rect x="100" y="170" width="280" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="184" width="260" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="198" width="270" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="212" width="240" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="240" width="280" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="254" width="265" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="268" width="250" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="282" width="270" height="8" rx="2" fill="#888" opacity="0.4"/>
  <rect x="100" y="296" width="195" height="8" rx="2" fill="#888" opacity="0.4"/>
  <!-- FAKE NEWS stamp -->
  <rect x="110" y="320" width="185" height="36" rx="4" fill="none" stroke="#cc0000" stroke-width="3" opacity="0.9"/>
  <text x="202" y="345" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="20" fill="#cc0000" opacity="0.9" transform="rotate(-8 202 345)">MISLEADING</text>
  <!-- Analysis panel right -->
  <rect x="450" y="70" width="270" height="300" rx="12" fill="#1a0a1a" stroke="#ce93d8" stroke-width="1.5" opacity="0.97"/>
  <text x="585" y="105" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#ce93d8">RoBERTa Analysis</text>
  <!-- Confidence meter -->
  <text x="470" y="135" font-family="system-ui" font-size="12" fill="#aaa">Misinformation Score</text>
  <rect x="470" y="145" width="230" height="16" rx="8" fill="#311b92" opacity="0.4"/>
  <rect x="470" y="145" width="207" height="16" rx="8" fill="#ce93d8" opacity="0.9"/>
  <text x="685" y="158" font-family="system-ui" font-size="11" fill="white">90%</text>
  <!-- Signal breakdown -->
  <text x="470" y="185" font-family="system-ui" font-size="12" fill="#ce93d8">Signals detected:</text>
  <rect x="470" y="196" width="230" height="26" rx="6" fill="#2d0f4e" opacity="0.8"/>
  <text x="480" y="214" font-family="system-ui" font-size="11" fill="#f48fb1">✗  Unsupported scientific claim</text>
  <rect x="470" y="228" width="230" height="26" rx="6" fill="#2d0f4e" opacity="0.8"/>
  <text x="480" y="246" font-family="system-ui" font-size="11" fill="#f48fb1">✗  No credible source cited</text>
  <rect x="470" y="260" width="230" height="26" rx="6" fill="#2d0f4e" opacity="0.8"/>
  <text x="480" y="278" font-family="system-ui" font-size="11" fill="#f48fb1">✗  Sensational language</text>
  <rect x="470" y="292" width="230" height="26" rx="6" fill="#1b5e20" opacity="0.6"/>
  <text x="480" y="310" font-family="system-ui" font-size="11" fill="#69f0ae">✓  Grammar/spelling OK</text>
  <!-- LIAR dataset badge -->
  <rect x="470" y="330" width="105" height="26" rx="6" fill="#311b92" opacity="0.8"/>
  <text x="522" y="348" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ce93d8">LIAR dataset</text>
  <rect x="585" y="330" width="115" height="26" rx="6" fill="#311b92" opacity="0.8"/>
  <text x="642" y="348" text-anchor="middle" font-family="system-ui" font-size="11" fill="#ce93d8">Browser Ext.</text>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#ce93d840">RoBERTa · LIAR Dataset · Fake News Detection</text>
</svg>
