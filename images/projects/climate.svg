<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="hotcold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="40%" stop-color="#42a5f5"/>
      <stop offset="60%" stop-color="#ffca28"/>
      <stop offset="80%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Axes -->
  <line x1="80" y1="320" x2="700" y2="320" stroke="#ffffff30" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="320" stroke="#ffffff30" stroke-width="1"/>
  <!-- Grid -->
  <line x1="80" y1="220" x2="700" y2="220" stroke="#ffffff12" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="150" x2="700" y2="150" stroke="#ffffff12" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- Year labels -->
  <text x="80" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">1970</text>
  <text x="204" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">1980</text>
  <text x="328" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">1990</text>
  <text x="452" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">2000</text>
  <text x="576" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">2010</text>
  <text x="700" y="340" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">2020</text>
  <!-- Temperature anomaly bars (colored by anomaly magnitude) -->
  <rect x="86" y="258" width="10" height="62" rx="2" fill="#42a5f5" opacity="0.7"/>
  <rect x="98" y="248" width="10" height="72" rx="2" fill="#42a5f5" opacity="0.7"/>
  <rect x="110" y="242" width="10" height="78" rx="2" fill="#64b5f6" opacity="0.7"/>
