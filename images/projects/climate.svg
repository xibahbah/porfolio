  <rect x="146" y="240" width="10" height="80" rx="2" fill="#42a5f5" opacity="0.7"/>
  <rect x="158" y="252" width="10" height="68" rx="2" fill="#64b5f6" opacity="0.7"/>
  <rect x="170" y="245" width="10" height="75" rx="2" fill="#90caf9" opacity="0.7"/>
  <rect x="182" y="258" width="10" height="62" rx="2" fill="#90caf9" opacity="0.7"/>
