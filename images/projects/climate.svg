  <rect x="632" y="158" width="10" height="162" rx="2" fill="#b71c1c" opacity="0.95"/>
  <rect x="644" y="148" width="10" height="172" rx="2" fill="#b71c1c" opacity="1"/>
  <rect x="656" y="140" width="10" height="180" rx="2" fill="#b71c1c" opacity="1"/>
  <rect x="668" y="130" width="10" height="190" rx="2" fill="#880e0e" opacity="1"/>
