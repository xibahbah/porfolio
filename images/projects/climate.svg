  <!-- Trend line -->
  <polyline points="91,275 205,265 325,250 450,240 580,210 695,130" fill="none" stroke="white" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
  <!-- Color scale bar bottom -->
  <rect x="200" y="370" width="400" height="18" rx="9" fill="url(#hotcold)" opacity="0.9"/>
  <text x="200" y="405" font-family="system-ui" font-size="11" fill="#64b5f6">–0.5°C</text>
  <text x="600" y="405" text-anchor="end" font-family="system-ui" font-size="11" fill="#ef5350">+1.4°C</text>
  <text x="400" y="405" text-anchor="middle" font-family="system-ui" font-size="11" fill="#aaa">Temperature Anomaly from 1950 Baseline</text>
